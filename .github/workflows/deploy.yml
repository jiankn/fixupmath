# 推送到 main 后构建网站，用 wrangler 部署到 Cloudflare Workers（jiankn@gmail.com 账号的 fixupmath Worker）。
# 2026-10-24 从旧 Cloudflare 账号迁来：旧账号登录不上，它的 Workers Builds 还占着本仓库的 Git 连接，
# 所以改由 GitHub Actions 构建和部署。自定义域名 fixupmath.com / www.fixupmath.com 已在新账号绑定，部署不会改动它们。
# 需要仓库密钥 CLOUDFLARE_API_TOKEN（权限：账户 · Workers 脚本 · 编辑）。
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

# 同一时间只部署一次；排队的那次会部署当时最新的 main
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 62ca98e53f85ec589d9f64e5365055d3
        run: npx wrangler deploy
